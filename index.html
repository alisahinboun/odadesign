<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>370×270 Ofis Odası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ===========================================================================
   Palet, odanin kendi malzemelerinden turetildi:
     vurgu   = bolüntü panel sarisi  #f2c11c  (RAL 1023)
     olumlu  = yesil dusey serit     #3faa35  (RAL 6018)
     notrler = lila duvar boyasindan hafif mor egilimli koyu griler
   Bu bir CAD viewport arayuzu; bilincli olarak tek gorsel dunyaya (koyu
   govde) baglidir, bu yuzden tum renkler acikca boyanir.
   ========================================================================= */
:root{
  --ground:#16151a; --panel:#1d1b22; --raise:#26232d; --sink:#121116;
  --line:#332f3c;   --line-soft:#282531;
  --txt:#ece8f1;    --txt-2:#b6afc2; --txt-3:#8a8398;
  --acc:#f2c11c;    --acc-dim:#8a6f11; --acc-ink:#2a2205;
  --pos:#6cc248;    --flag:#e0913c;   --info:#7fb2e8;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--txt);
  font:400 13px/1.5 var(--ui);overscroll-behavior:none;
  -webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
canvas{display:block;outline:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ---------------------------------------------------------- olcum rayi */
#panel{position:fixed;top:0;right:0;bottom:0;width:330px;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10;
  transition:transform .22s ease}
#panel.hidden{transform:translateX(100%)}
#panel header{padding:15px 17px 13px;border-bottom:1px solid var(--line);flex:0 0 auto;
  background:linear-gradient(180deg,var(--raise),var(--panel));position:relative}
#close{position:absolute;right:10px;top:12px;width:28px;height:28px;background:none;
  border:1px solid var(--line);border-radius:4px;color:var(--txt-3);cursor:pointer;
  font-size:13px;line-height:1;padding:0}
#close:hover{color:var(--txt);border-color:var(--acc)}
#panel header h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.10em;
  text-transform:uppercase;color:var(--txt)}
#panel header h1 b{color:var(--acc);font-weight:700}
#panel header p{margin:5px 0 0;font-size:11px;color:var(--txt-3);font-family:var(--mono)}
#scroll{overflow-y:auto;flex:1;padding:0 0 48px;scrollbar-width:thin;
  scrollbar-color:#3b3646 transparent}
#scroll::-webkit-scrollbar{width:9px}
#scroll::-webkit-scrollbar-thumb{background:#3b3646;border-radius:5px}

.sec{border-bottom:1px solid var(--line-soft)}
.sec>summary{padding:11px 17px;cursor:pointer;font-weight:600;font-size:10.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--txt-2);list-style:none;
  display:flex;justify-content:space-between;align-items:center;user-select:none}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary::after{content:"+";color:var(--txt-3);font-size:14px;font-weight:400;
  font-family:var(--mono)}
.sec[open]>summary::after{content:"–"}
.sec>summary:hover{background:var(--raise);color:var(--txt)}
.sec[open]>summary{color:var(--txt)}
.body{padding:2px 17px 16px;display:flex;flex-direction:column;gap:9px}

/* ------------------------------------------------------------ katmanlar */
.rows{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12.5px}
.row label{flex:1;cursor:pointer;color:var(--txt-2)}
.row input:checked+label{color:var(--txt)}
input[type=checkbox]{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;flex:0 0 auto}
input[type=range]{width:100%;accent-color:var(--acc);margin:2px 0}

/* --------------------------------------------------------------- veri */
table.kv{width:100%;border-collapse:collapse;font-size:12px}
table.kv td{padding:3.5px 0;vertical-align:baseline}
table.kv td:first-child{color:var(--txt-3);white-space:nowrap;padding-right:8px}
table.kv td:last-child{text-align:right;font-family:var(--mono);
  font-variant-numeric:tabular-nums;color:var(--txt);white-space:nowrap}
table.kv tr.hi td:last-child{color:var(--acc);font-weight:600}

/* guven rozeti: olcunun nereden geldigini kodlar */
.src{display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:500;
  letter-spacing:.07em;text-transform:uppercase;padding:1px 4px;border-radius:2px;
  margin-left:6px;vertical-align:1px;border:1px solid}
.src.k{color:var(--pos);border-color:#33612a;background:#1b2718}
.src.f{color:var(--flag);border-color:#5c4021;background:#2a2013}
.src.t{color:var(--txt-3);border-color:#3b3646;background:#232029}

table.sch{width:100%;border-collapse:collapse;font-size:11.5px}
table.sch th{text-align:left;color:var(--txt-3);font-weight:600;padding:0 4px 6px 0;
  border-bottom:1px solid var(--line);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.10em}
table.sch th:last-child{text-align:right}
table.sch td{padding:4.5px 4px 4.5px 0;border-bottom:1px solid var(--line-soft);color:var(--txt-2)}
table.sch tr{cursor:pointer}
table.sch tr:hover td{background:var(--raise);color:var(--txt)}
table.sch td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  color:var(--txt-3);white-space:nowrap}
table.sch tr:hover td.n{color:var(--acc)}
table.sch th.eye,table.sch td.eye{width:20px;padding-right:6px;text-align:left}
table.sch td.eye input{width:13px;height:13px;accent-color:var(--acc);cursor:pointer;
  margin:0;vertical-align:middle}
table.sch tr.grp{cursor:default}
table.sch tr.grp td{color:var(--txt-3);font-size:10px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:600;padding-top:10px;border-bottom:none}
table.sch tr.grp:hover td{background:none;color:var(--txt-3)}
table.sch tr.off td{opacity:.38}
table.sch tr.off td.eye{opacity:1}
.poz{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:600;
  color:var(--acc);background:var(--acc-dim);background:rgba(242,193,28,.11);
  border:1px solid rgba(242,193,28,.28);border-radius:2px;padding:0 4px;margin-right:6px}

/* -------------------------------------------------------------- butonlar */
.btn{display:block;width:100%;text-align:left;background:var(--raise);color:var(--txt);
  border:1px solid var(--line);border-radius:4px;padding:7px 10px;cursor:pointer;
  font:500 12px/1.2 var(--ui)}
.btn:hover{background:#2f2b37;border-color:#453f52}
.btn.pri{background:rgba(242,193,28,.10);border-color:rgba(242,193,28,.38);color:var(--acc)}
.btn.pri:hover{background:rgba(242,193,28,.17)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

/* ------------------------------------------------------------- malzeme */
.sw{display:flex;align-items:center;gap:9px;padding:2.5px 0;font-size:11.5px}
.sw i{width:22px;height:15px;border-radius:2px;border:1px solid rgba(255,255,255,.16);flex:0 0 auto}
.sw b{color:var(--txt-2);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw em{margin-left:auto;color:var(--txt-3);font-style:normal;font-size:10px;
  font-family:var(--mono);flex:0 0 auto}

/* --------------------------------------------------------------- notlar */
.note{font-size:11px;color:var(--txt-3);line-height:1.55;margin:0}
.note b{color:var(--txt-2);font-weight:600}
.note code{font-family:var(--mono);font-size:10.5px;color:var(--txt-2)}
.callout{border-left:2px solid var(--flag);padding:7px 0 7px 10px;background:rgba(224,145,60,.06);
  border-radius:0 3px 3px 0}
.callout .note{color:#d5b58c}
.callout .note b{color:var(--flag)}

/* -------------------------------------------------------- sema secici */
.schemes{display:flex;flex-direction:column;gap:5px}
button.scheme{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;
  background:var(--sink);border:1px solid var(--line);border-radius:4px;padding:8px 10px;
  cursor:pointer;font-family:var(--ui);text-align:left;color:var(--txt-2);width:100%}
button.scheme:hover{background:var(--raise);border-color:#453f52;color:var(--txt)}
button.scheme.on{border-color:var(--acc);background:rgba(242,193,28,.09);color:var(--txt)}
button.scheme .code{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--txt-3);
  letter-spacing:.04em}
button.scheme.on .code{color:var(--acc)}
button.scheme .nm{font-size:12.5px;font-weight:500}
button.scheme .kind{font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--txt-3);border:1px solid var(--line);
  border-radius:2px;padding:1px 4px}
button.scheme.on .kind{border-color:rgba(242,193,28,.35);color:var(--acc)}
.callout-inline{border-left:2px solid var(--line);padding-left:9px;margin-top:2px}

/* tespit kartlari - modelden cikan bulgular */
.find{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--sink)}
.find h4{margin:0 0 3px;font-size:11px;font-weight:600;color:var(--txt);
  letter-spacing:.02em;display:flex;gap:7px;align-items:baseline}
.find h4 span{font-family:var(--mono);font-size:9.5px;color:var(--acc);letter-spacing:.06em}
.find h4 em.state{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:8.5px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--flag);border:1px solid #5c4021;
  background:#2a2013;border-radius:2px;padding:1px 4px;flex:0 0 auto}
.find.ok{border-color:#33612a;background:#161d14}
.find.ok h4 span{color:var(--pos)}
.find.ok h4 em.state{color:var(--pos);border-color:#33612a;background:#1b2718}
.find p{margin:0;font-size:11px;line-height:1.5;color:var(--txt-3)}
.find p b{color:var(--txt-2);font-weight:600}

/* ------------------------------------------------------ komut seridi */
#topbar{position:fixed;top:12px;left:12px;z-index:11;display:flex;gap:5px;flex-wrap:wrap;
  max-width:calc(100% - 366px)}
#topbar button{background:rgba(29,27,34,.92);color:var(--txt-2);border:1px solid var(--line);
  border-radius:4px;padding:6px 11px;font:500 11.5px/1.2 var(--ui);cursor:pointer;
  backdrop-filter:blur(8px);letter-spacing:.01em}
#topbar button:hover{background:rgba(47,43,55,.95);color:var(--txt)}
#topbar button.act{border-color:var(--acc);color:var(--acc);background:rgba(242,193,28,.10)}
#topbar .sep{width:1px;align-self:stretch;background:var(--line);margin:0 3px}

#hint{position:fixed;left:12px;bottom:12px;z-index:11;background:rgba(29,27,34,.92);
  border:1px solid var(--line);border-radius:4px;padding:7px 12px;font-size:11px;
  color:var(--txt-3);backdrop-filter:blur(8px);max-width:min(600px,58vw);line-height:1.6}
#hint b{color:var(--txt-2);font-weight:600}
#hint kbd{font-family:var(--mono);font-size:10px;color:var(--acc);
  border:1px solid var(--line);border-radius:2px;padding:0 3px;background:var(--sink)}

/* ------------------------------------------------------- olcum okumasi */
#readout{position:fixed;right:342px;bottom:12px;z-index:11;background:rgba(29,27,34,.96);
  border:1px solid var(--acc);border-radius:4px;padding:9px 13px;font-size:12px;
  display:none;backdrop-filter:blur(8px);max-width:290px;box-shadow:var(--shadow)}
#readout .big{font-family:var(--mono);font-size:21px;font-weight:600;color:var(--acc);
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
#readout .nm{font-size:12.5px;font-weight:600;color:var(--txt);line-height:1.3}
#readout .sm{color:var(--txt-3);font-size:10.5px;margin-top:3px;line-height:1.5;
  font-family:var(--mono)}
#readout .sm.w{color:#d5b58c;font-family:var(--ui);font-size:10.5px}

/* ------------------------------------------------------------- olcum */
#mlab{position:fixed;inset:0;z-index:10;pointer-events:none}
#mlab .ml{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  font-family:var(--mono);font-size:11px;font-weight:600;line-height:1;
  padding:3px 6px;border-radius:3px;letter-spacing:.01em}
#mlab .ml.no{background:#ffd23f;color:#231f10;width:16px;height:16px;padding:0;
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px rgba(29,27,34,.75)}
#mlab .ml.dist{background:#ffd23f;color:#231f10;font-size:13px;padding:4px 8px;
  transform:translate(-50%,-140%);box-shadow:0 2px 8px rgba(0,0,0,.45)}
#mlab .ml.pre{background:rgba(29,27,34,.9);color:#cdc7b4;
  transform:translate(-50%,-140%);border:1px solid #6b6656}

#toggle{position:fixed;right:12px;top:12px;z-index:12;width:32px;height:32px;
  background:rgba(29,27,34,.92);border:1px solid var(--line);border-radius:4px;
  color:var(--txt-2);cursor:pointer;font-size:15px;line-height:1;display:none}
#panel.hidden ~ #toggle{display:block}

/* -------------------------------------------------------------- yukleme */
#loading{position:fixed;inset:0;background:var(--ground);z-index:50;display:flex;
  align-items:center;justify-content:center;flex-direction:column;gap:16px;
  transition:opacity .4s}
#loading .bar{width:180px;height:2px;background:#2b2833;overflow:hidden}
#loading .bar i{display:block;height:100%;width:34%;background:var(--acc);
  animation:sl 1.05s cubic-bezier(.6,0,.4,1) infinite}
@keyframes sl{0%{transform:translateX(-110%)}100%{transform:translateX(400%)}}
#loading p{color:var(--txt-3);font:400 11.5px/1 var(--mono);letter-spacing:.08em;margin:0;
  text-transform:uppercase}

@media (max-width:1080px) and (min-width:821px){
  #panel{width:296px} #readout{right:308px} #topbar{max-width:calc(100% - 330px)}
}

/* =======================================================================
   TELEFON / TABLET
   Panel sag kenardan alt sayfaya (bottom sheet) doner; komut seridi tek
   satirda yana kayar; dokunmatikte hedefler buyutulur.
   ===================================================================== */
@media (max-width:820px){
  #panel{top:auto;left:0;right:0;bottom:0;width:100%;
    height:min(72vh,620px);border-left:none;border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);
    transition:transform .24s cubic-bezier(.3,0,.2,1)}
  #panel.hidden{transform:translateY(100%)}
  /* tutamak cizgisi - asagi kayabilecegini gosterir */
  #panel header::before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;
    margin-left:-19px;border-radius:2px;background:var(--line)}
  #panel header{padding:16px 17px 12px}
  #close{width:34px;height:34px;font-size:15px;top:14px}
  #scroll{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    -webkit-overflow-scrolling:touch}

  #topbar{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:0;right:0;
    max-width:none;flex-wrap:nowrap;overflow-x:auto;gap:6px;
    padding:0 12px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  #topbar::-webkit-scrollbar{display:none}
  #topbar button{flex:0 0 auto;padding:9px 13px;font-size:12.5px}
  #topbar .sep{flex:0 0 1px;margin:0 2px}

  #hint{display:none}

  #readout{left:10px;right:10px;top:10px;bottom:auto;max-width:none;padding:10px 13px}
  #readout .big{font-size:19px}

  #toggle{display:block;right:12px;bottom:calc(60px + env(safe-area-inset-bottom,0px));
    top:auto;width:auto;height:40px;padding:0 15px;font:600 12.5px/1 var(--ui);
    border-color:var(--acc);color:var(--acc);background:rgba(29,27,34,.95);
    box-shadow:var(--shadow)}
  /* Alt sayfa acikken komut seridi ve "Seçenekler" dugmesi onun ustunde
     kaliyordu. Kardes secici (~) ise ise yaramiyor: #toggle, #panel'den ONCE
     geliyor. Bu yuzden govdeye sinif konuyor. */
  body.panel-open #toggle,
  body.panel-open #topbar{display:none}

  #mlab .ml.no{width:22px;height:22px;font-size:12px}
  #mlab .ml.dist{font-size:15px;padding:5px 10px}
}

/* Dokunmatik: parmak icin hedefler buyur (ekran genisliginden bagimsiz) */
@media (pointer:coarse){
  .sec>summary{padding:15px 17px;font-size:11px}
  button.scheme{padding:11px 12px}
  table.sch td{padding:9px 4px}
  table.sch td.eye input{width:19px;height:19px}
  .row{padding:6px 0}
  input[type=checkbox]{width:19px;height:19px}
  .btn{padding:10px 12px;font-size:12px}
}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="topbar"></div>
  <div id="readout"></div>
  <div id="hint"></div>
  <button id="toggle" title="Paneli göster" aria-label="Paneli göster">☰</button>

  <aside id="panel">
    <header>
      <h1>Ofis Odası · <b>3B Röleve</b></h1>
      <p id="subhead">370 × 270 × 290 cm</p>
      <button id="close" title="Paneli kapat" aria-label="Paneli kapat">✕</button>
    </header>
    <div id="scroll"></div>
  </aside>

  <div id="loading">
    <div class="bar"><i></i></div>
    <p>Model oluşturuluyor</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
