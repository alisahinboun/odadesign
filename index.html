<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Oda Tasarimi - 3B Model</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171b21; --panel2:#1e232b; --line:#2b323c;
    --txt:#e6e9ee; --dim:#9aa4b2; --acc:#f2c11c; --acc2:#3faa35; --blue:#6aa9e9;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none}
  #app{position:fixed;inset:0}
  canvas{display:block;outline:none}

  /* ---------------- yan panel ---------------- */
  #panel{position:fixed;top:0;right:0;bottom:0;width:322px;background:var(--panel);
    border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:10;
    transition:transform .22s ease}
  #panel.hidden{transform:translateX(100%)}
  #panel header{padding:14px 16px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #panel header h1{margin:0;font-size:14px;letter-spacing:.02em}
  #panel header p{margin:4px 0 0;font-size:11.5px;color:var(--dim)}
  #scroll{overflow-y:auto;flex:1;padding:4px 0 40px}
  #scroll::-webkit-scrollbar{width:9px}
  #scroll::-webkit-scrollbar-thumb{background:#2f3742;border-radius:5px}

  .sec{border-bottom:1px solid var(--line)}
  .sec>summary{padding:10px 16px;cursor:pointer;font-weight:600;font-size:12px;
    letter-spacing:.06em;text-transform:uppercase;color:#c3ccd8;list-style:none;
    display:flex;justify-content:space-between;align-items:center;user-select:none}
  .sec>summary::-webkit-details-marker{display:none}
  .sec>summary::after{content:"+";color:var(--dim);font-size:15px;font-weight:400}
  .sec[open]>summary::after{content:"−"}
  .sec>summary:hover{background:#1b2027}
  .body{padding:4px 16px 14px}

  .row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12.5px}
  .row label{flex:1;cursor:pointer;color:#cfd6df}
  input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px;cursor:pointer}
  input[type=range]{width:100%;accent-color:var(--acc)}

  .btn{display:block;width:100%;text-align:left;background:var(--panel2);
    color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 10px;
    margin:4px 0;cursor:pointer;font-size:12.5px;font-family:inherit}
  .btn:hover{background:#252c36;border-color:#3a434f}
  .btn.act{border-color:var(--acc);color:var(--acc)}
  .btn.pri{background:#243244;border-color:#3a5578}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .grid2 .btn{margin:0}

  table.kv{width:100%;border-collapse:collapse;font-size:12px}
  table.kv td{padding:3px 0;vertical-align:top}
  table.kv td:first-child{color:var(--dim);white-space:nowrap;padding-right:10px}
  table.kv td:last-child{text-align:right;font-variant-numeric:tabular-nums}

  table.sch{width:100%;border-collapse:collapse;font-size:11.5px}
  table.sch th{text-align:left;color:var(--dim);font-weight:600;padding:4px 4px 6px 0;
    border-bottom:1px solid var(--line);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
  table.sch td{padding:4px 4px 4px 0;border-bottom:1px solid #21262e}
  table.sch tr{cursor:pointer}
  table.sch tr:hover td{background:#1f242c;color:#fff}
  table.sch td.n{text-align:right;font-variant-numeric:tabular-nums;color:#b9c2ce;white-space:nowrap}
  .tag{display:inline-block;background:#2a313a;color:var(--acc);border-radius:3px;
    padding:0 4px;font-size:10px;font-weight:700;margin-right:5px}

  .sw{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px}
  .sw i{width:20px;height:14px;border-radius:3px;border:1px solid rgba(255,255,255,.18);flex:0 0 auto}
  .sw b{color:#cfd6df;font-weight:500}
  .sw em{margin-left:auto;color:var(--dim);font-style:normal;font-size:10.5px}

  .note{font-size:11px;color:var(--dim);line-height:1.5;margin:6px 0 0}
  .warn{border-left:2px solid var(--acc);padding-left:8px;color:#d8c88a}

  /* ---------------- ust bar / ipuclari ---------------- */
  #topbar{position:fixed;top:12px;left:12px;z-index:11;display:flex;gap:6px;flex-wrap:wrap;
    max-width:calc(100% - 360px)}
  #topbar button{background:rgba(23,27,33,.92);color:var(--txt);border:1px solid var(--line);
    border-radius:6px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit;
    backdrop-filter:blur(6px)}
  #topbar button:hover{background:#252c36}
  #topbar button.act{border-color:var(--acc);color:var(--acc)}

  #hint{position:fixed;left:12px;bottom:12px;z-index:11;background:rgba(23,27,33,.9);
    border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:11.5px;
    color:var(--dim);backdrop-filter:blur(6px);max-width:min(560px,60vw)}
  #hint b{color:#cfd6df;font-weight:600}

  #readout{position:fixed;right:334px;top:12px;z-index:11;background:rgba(23,27,33,.94);
    border:1px solid var(--acc);border-radius:6px;padding:8px 12px;font-size:12.5px;
    display:none;backdrop-filter:blur(6px);max-width:280px}
  #readout .big{font-size:19px;font-weight:700;color:var(--acc);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  #readout .sm{color:var(--dim);font-size:11px;margin-top:2px}

  #toggle{position:fixed;right:12px;top:12px;z-index:12;width:34px;height:34px;
    background:rgba(23,27,33,.92);border:1px solid var(--line);border-radius:6px;
    color:var(--txt);cursor:pointer;font-size:16px;line-height:1;display:none}
  #panel.hidden ~ #toggle{display:block}

  #loading{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;
    align-items:center;justify-content:center;flex-direction:column;gap:14px;
    transition:opacity .4s}
  #loading .bar{width:190px;height:3px;background:#242a33;border-radius:2px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:35%;background:var(--acc);
    animation:sl 1.05s ease-in-out infinite}
  @keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}
  #loading p{color:var(--dim);font-size:12.5px;margin:0}

  @media (max-width:820px){
    #panel{width:290px}
    #readout{right:302px}
    #topbar{max-width:calc(100% - 320px)}
  }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="topbar"></div>
  <div id="readout"></div>
  <div id="hint"></div>
  <button id="toggle" title="Paneli goster">☰</button>

  <aside id="panel">
    <header>
      <h1>OFİS ODASI — 3B MODEL</h1>
      <p id="subhead">Parametrik röleve modeli · R00</p>
    </header>
    <div id="scroll"></div>
  </aside>

  <div id="loading">
    <div class="bar"><i></i></div>
    <p>Model oluşturuluyor…</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
